version: 2.1
workflows:
  build_test_release:
    jobs:
      - test
      - build
      - release:
          requires:
            - build
            - test
          filters:
            branches:
              only: /^master|dev|[0-9]+\.[0-9]+\.x$/

jobs:
  test:
    docker:
      - image: cimg/node:22.23.4

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v3-node22-dependencies-{{ checksum "yarn.lock" }}

      - run: yarn install --frozen-lockfile

      - save_cache:
          paths:
            - node_modules
          key: v3-node22-dependencies-{{ checksum "yarn.lock" }}

      - run: yarn run lint
      - run: yarn test -w 1 --coverage
      - run: bash <(curl -s https://codecov.io/bash)

  build:
    docker:
      - image: cimg/node:22.23.4

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v3-node22-dependencies-{{ checksum "yarn.lock" }}

      - run: yarn install --frozen-lockfile

      - save_cache:
          paths:
            - node_modules
          key: v3-node22-dependencies-{{ checksum "yarn.lock" }}

      - run:
          name: Build Project
          command: yarn run build
          no_output_timeout: 30m
      # - persist_to_workspace:
      #     root: .
      #     paths:
      #       - build

  release:
    docker:
      - image: cimg/node:22.23.4

    working_directory: ~/repo

    steps:
      - checkout
      - run: yarn install --frozen-lockfile
      - run: yarn semantic-release
